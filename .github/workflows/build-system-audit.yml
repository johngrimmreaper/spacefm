name: SpaceFM build-system audit

on:
  push:
    branches:
      - audit/build-system-20260814
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf automake libtool intltool gettext pkg-config \
            libgtk2.0-dev libudev-dev libstartup-notification0-dev \
            libffmpegthumbnailer-dev libx11-dev

      - name: Record environment
        run: |
          mkdir -p audit-logs
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            gcc --version | head -1
            autoconf --version | head -1
            automake --version | head -1
            libtoolize --version | head -1
            intltoolize --version | head -1
          } | tee audit-logs/environment.log

      - name: Run build-system target matrix
        shell: bash
        run: |
          set +e
          mkdir -p audit-logs
          : > audit-logs/results.tsv

          run_target() {
            name="$1"
            shift
            echo "===== $name ====="
            ( set -o pipefail; "$@" 2>&1 | tee "audit-logs/${name}.log" )
            rc=${PIPESTATUS[0]}
            printf '%s\t%s\n' "$name" "$rc" | tee -a audit-logs/results.tsv
            return 0
          }

          run_target autogen ./autogen.sh --with-gtk2
          run_target make make -j"$(nproc)"
          run_target check make check
          run_target dist make dist

          {
            echo '=== generated archives ==='
            ls -l spacefm-*.tar.* 2>/dev/null || true
            for a in spacefm-*.tar.gz; do
              [ -e "$a" ] || continue
              echo "=== $a selected contents ==="
              tar -tzf "$a" | grep -E '(^|/)(gtk2-compat\.h|mount\.rules|spacefm-manual-en\.html|spacefm(-find|-root|-48-|-128-).*\.png|faenza/spacefm.*\.png)$' || true
            done
            for a in spacefm-*.tar.bz2; do
              [ -e "$a" ] || continue
              echo "=== $a selected contents ==="
              tar -tjf "$a" | grep -E '(^|/)(gtk2-compat\.h|mount\.rules|spacefm-manual-en\.html|spacefm(-find|-root|-48-|-128-).*\.png|faenza/spacefm.*\.png)$' || true
            done
          } | tee audit-logs/dist-contents.log

          rm -rf _install
          mkdir -p _install
          run_target install make install DESTDIR="$PWD/_install"
          run_target uninstall make uninstall DESTDIR="$PWD/_install"
          find _install -mindepth 1 -print | sort | tee audit-logs/uninstall-leftovers.log

          run_target distclean make distclean

          # Reconfigure after distclean, then exercise Automake's full distcheck chain.
          run_target reconfigure ./configure --with-gtk2
          run_target distcheck make distcheck DISTCHECK_CONFIGURE_FLAGS='--with-gtk2'

          echo '=== target results ==='
          column -t -s $'\t' audit-logs/results.tsv || cat audit-logs/results.tsv

          # Baseline audit intentionally does not fail the workflow; logs are the product.
          exit 0

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacefm-build-system-audit
          path: audit-logs/
          if-no-files-found: error
