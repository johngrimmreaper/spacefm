name: SpaceFM signed GTK3 audit retry

on:
  push:
    branches:
      - audit/signed-build-system-repair-20260814
  workflow_dispatch:

jobs:
  gtk3:
    name: gtk3-default-retry
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact signed repair head
        uses: actions/checkout@v4
        with:
          ref: 5bcfb2965d4b8f8dfcfc0a8e8c68173134c929f9
          fetch-depth: 0

      - name: Verify tested source commit
        run: |
          test "$(git rev-parse HEAD)" = '5bcfb2965d4b8f8dfcfc0a8e8c68173134c929f9'

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          timeout 10m sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential \
            autoconf automake libtool intltool gettext pkg-config \
            libgtk2.0-dev libgtk-3-dev libudev-dev \
            libstartup-notification0-dev libffmpegthumbnailer-dev libx11-dev

      - name: Record environment
        run: |
          mkdir -p audit-logs
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "configuration=gtk3-default-retry"
            echo "flags=--with-gtk3"
            gcc --version | head -1
            autoconf --version | head -1
            automake --version | head -1
            libtoolize --version | head -1
            intltoolize --version | head -1
          } | tee audit-logs/environment.log

      - name: Run build-system target matrix
        shell: bash
        run: |
          set +e
          mkdir -p audit-logs
          : > audit-logs/results.tsv
          overall=0
          flags='--with-gtk3'

          run_target() {
            name="$1"
            shift
            echo "===== $name ====="
            ( set -o pipefail; "$@" 2>&1 | tee "audit-logs/${name}.log" )
            rc=${PIPESTATUS[0]}
            printf '%s\t%s\n' "$name" "$rc" | tee -a audit-logs/results.tsv
            if test "$rc" -ne 0; then
              overall=1
            fi
            return 0
          }

          run_target autogen ./autogen.sh $flags
          git diff -- Makefile.in src/Makefile.in data/Makefile.in etc/Makefile.in \
            po/Makefile.in.in configure configure.ac aclocal.m4 \
            > audit-logs/generated-files.diff

          run_target make make -j"$(nproc)"
          run_target check make check
          run_target dist make dist

          {
            echo '=== generated archives ==='
            ls -l spacefm-*.tar.* 2>/dev/null || true
            for a in spacefm-*.tar.gz; do
              [ -e "$a" ] || continue
              echo "=== $a full contents ==="
              tar -tzf "$a"
            done
            for a in spacefm-*.tar.bz2; do
              [ -e "$a" ] || continue
              echo "=== $a full contents ==="
              tar -tjf "$a"
            done
          } > audit-logs/dist-contents.log

          rm -rf _install
          mkdir -p _install
          run_target install make install DESTDIR="$PWD/_install"
          run_target uninstall make uninstall DESTDIR="$PWD/_install"
          find _install -mindepth 1 -print | sort | tee audit-logs/uninstall-leftovers.log

          run_target distclean make distclean
          run_target reconfigure ./configure $flags
          run_target distcheck make distcheck DISTCHECK_CONFIGURE_FLAGS="$flags"

          echo '=== target results ==='
          column -t -s $'\t' audit-logs/results.tsv || cat audit-logs/results.tsv

          exit "$overall"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacefm-signed-build-system-audit-gtk3-retry
          path: audit-logs/
          if-no-files-found: error
