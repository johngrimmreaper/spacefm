name: Resolute package audit

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  lintian:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs lintian

      - name: Install build dependencies
        run: |
          mk-build-deps \
            --install \
            --remove \
            --root-cmd=sudo \
            --tool='apt-get -y --no-install-recommends' \
            debian/control

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-logs package-artifacts
          dpkg-buildpackage -us -uc -b 2>&1 | tee audit-logs/dpkg-buildpackage.log
          find .. -maxdepth 1 -type f \
            \( -name 'spacefm_*.deb' \
               -o -name 'spacefm-dbgsym_*.ddeb' \
               -o -name 'spacefm_*.changes' \
               -o -name 'spacefm_*.buildinfo' \) \
            -exec cp -v {} package-artifacts/ \;

      - name: Exhaustive Lintian
        shell: bash
        run: |
          set +e
          lintian --version | tee audit-logs/lintian-version.log
          changes="$(find package-artifacts -maxdepth 1 -name 'spacefm_*.changes' -print -quit)"
          lintian -I -E --pedantic --show-overrides "$changes" \
            >audit-logs/lintian-full.log 2>&1
          rc=$?
          printf '%s\n' "$rc" >audit-logs/lintian-full.status
          cat audit-logs/lintian-full.log
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lintian-26.04-audit
          path: |
            audit-logs/
            package-artifacts/
          if-no-files-found: error
