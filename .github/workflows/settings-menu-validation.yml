name: Settings menu regression

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gtk2
            flags: --with-gtk2
          - name: gtk3
            flags: --with-gtk3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake gettext intltool libtool pkg-config \
            libbtrfs-dev libffmpegthumbnailer-dev libglib2.0-dev libgtk2.0-dev \
            libgtk-3-dev libstartup-notification0-dev libudev-dev libx11-dev

      - name: Apply candidate layout
        run: |
          git apply .github/audit/settings-menu.patch
          git diff --check

      - name: Build
        run: |
          ./autogen.sh ${{ matrix.flags }}
          make -j"$(nproc)"

      - name: Check menu placement
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'settings_menu_item = gtk_menu_item_new_with_mnemonic' src/main-window.c
          ! grep -F 'main_design_mode main_prefs' src/main-window.c
          ! sed -n '/GtkWidget\* create_devices_menu/,/^}/p' src/main-window.c | grep -F 'dev_menu_settings'
          sed -n '/\/\/ Settings/,/\/\/ Help/p' src/main-window.c | grep -F 'xset_get( "main_prefs" )'
          sed -n '/\/\/ Settings/,/\/\/ Help/p' src/main-window.c | grep -F 'xset_get( "dev_menu_settings" )'
